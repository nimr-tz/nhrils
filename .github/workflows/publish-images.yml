# -*- coding: utf-8 -*-

name: Publish Images

run-name: Publish NHRILS images from ${{ github.ref_name }} @ ${{ github.sha }}

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/publish-images.yml"
      - ".dockerignore"
      - "docker/**"
      - "scripts/**"
      - "invenio_app_ils/**"
      - "setup.cfg"
      - "setup.py"
      - "pyproject.toml"
      - "MANIFEST.in"
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for publishing NHRILS images"
        required: false
        default: "Manual image publish"

concurrency:
  group: nhrils-publish-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/nimr-tz/nhrils-backend
  FRONTEND_IMAGE: ghcr.io/nimr-tz/nhrils-frontend
  FRONTEND_UI_URL: https://nhrils.apps.nimr.or.tz
  FRONTEND_API_URL: https://nhrils.apps.nimr.or.tz/api
  FRONTEND_ENV_NAME: production

jobs:
  publish-backend:
    name: Backend image
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    outputs:
      image: ${{ steps.image.outputs.image }}
      tag: ${{ steps.image.outputs.tag }}
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: image
        run: |
          short_sha="${GITHUB_SHA::7}"
          echo "tag=sha-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "image=${BACKEND_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "ref=${BACKEND_IMAGE}:sha-${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish backend image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend/Dockerfile
          tags: ${{ steps.image.outputs.ref }}
          push: true
          provenance: false
          cache-from: type=gha,scope=nhrils-backend
          cache-to: type=gha,scope=nhrils-backend,mode=max

      - name: Summarize backend publish
        if: always()
        run: |
          {
            echo "## NHRILS Backend Image Publish"
            echo ""
            echo "- Result: ${{ job.status }}"
            echo "- Image: \`${{ steps.image.outputs.ref }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Source SHA: \`${{ github.sha }}\`"
            echo "- Dockerfile: \`docker/backend/Dockerfile\`"
            echo "- GitOps update: disabled"
            echo "- Deployment: disabled"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-frontend:
    name: Frontend image
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    outputs:
      image: ${{ steps.image.outputs.image }}
      tag: ${{ steps.image.outputs.tag }}
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: image
        run: |
          short_sha="${GITHUB_SHA::7}"
          echo "tag=sha-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "image=${FRONTEND_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "ref=${FRONTEND_IMAGE}:sha-${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish frontend image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend/Dockerfile
          tags: ${{ steps.image.outputs.ref }}
          push: true
          provenance: false
          build-args: |
            REACT_APP_INVENIO_UI_URL=${{ env.FRONTEND_UI_URL }}
            REACT_APP_INVENIO_REST_ENDPOINTS_BASE_URL=${{ env.FRONTEND_API_URL }}
            REACT_APP_ENV_NAME=${{ env.FRONTEND_ENV_NAME }}
          cache-from: type=gha,scope=nhrils-frontend
          cache-to: type=gha,scope=nhrils-frontend,mode=max

      - name: Summarize frontend publish
        if: always()
        run: |
          {
            echo "## NHRILS Frontend Image Publish"
            echo ""
            echo "- Result: ${{ job.status }}"
            echo "- Image: \`${{ steps.image.outputs.ref }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Source SHA: \`${{ github.sha }}\`"
            echo "- Dockerfile: \`docker/frontend/Dockerfile\`"
            echo "- UI URL: \`${FRONTEND_UI_URL}\`"
            echo "- API URL: \`${FRONTEND_API_URL}\`"
            echo "- Environment: \`${FRONTEND_ENV_NAME}\`"
            echo "- GitOps update: disabled"
            echo "- Deployment: disabled"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-summary:
    name: Publish summary
    runs-on: ubuntu-24.04
    needs:
      - publish-backend
      - publish-frontend
    if: always()

    steps:
      - name: Summarize image publish outcome
        run: |
          {
            echo "## NHRILS Image Publish Summary"
            echo ""
            echo "- Backend job: \`${{ needs.publish-backend.result }}\`"
            echo "- Backend image: \`${{ needs.publish-backend.outputs.image }}:${{ needs.publish-backend.outputs.tag }}\`"
            echo "- Backend digest: \`${{ needs.publish-backend.outputs.digest }}\`"
            echo "- Frontend job: \`${{ needs.publish-frontend.result }}\`"
            echo "- Frontend image: \`${{ needs.publish-frontend.outputs.image }}:${{ needs.publish-frontend.outputs.tag }}\`"
            echo "- Frontend digest: \`${{ needs.publish-frontend.outputs.digest }}\`"
            echo "- Source SHA: \`${{ github.sha }}\`"
            echo ""
            echo "No GitOps image pins were changed and no deployment was triggered by this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
