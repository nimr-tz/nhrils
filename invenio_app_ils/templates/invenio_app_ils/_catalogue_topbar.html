<header class="nhrils-topbar" aria-label="National Health Research Integrated Library System catalogue header">
  <a class="nhrils-brand" href="/nhrils/catalogue" aria-label="National Health Research Integrated Library System catalogue home">
    <img src="{{ url_for('invenio_app_ils.static', filename='images/nimr.svg') }}" alt="NIMR">
    <span>
      <strong>NHRILS</strong>
      <small>National Health Research Integrated Library System</small>
    </span>
  </a>
  <div class="nhrils-nav-groups">
    <nav class="nhrils-nav" aria-label="Catalogue navigation">
      <a href="/nhrils/catalogue"{% if active_page == "catalogue" %} aria-current="page"{% endif %}>Catalogue</a>
      <a href="/nhrils/catalogue/search"{% if active_page == "results" %} aria-current="page"{% endif %}>Search</a>
      <a href="/nhrils/catalogue/collections"{% if active_page == "collections" %} aria-current="page"{% endif %}>Collections</a>
      <a href="/nhrils/catalogue/contact"{% if active_page == "contact" %} aria-current="page"{% endif %}>Request</a>
    </nav>
    <nav class="nhrils-nav nhrils-nav-utility" aria-label="Catalogue support navigation">
      <a href="/nhrils/catalogue/about"{% if active_page == "about" %} aria-current="page"{% endif %}>About</a>
      <a href="/nhrils/catalogue/search-guide"{% if active_page == "search-guide" %} aria-current="page"{% endif %}>Help</a>
      <a href="/nhrils/catalogue/terms"{% if active_page == "terms" %} aria-current="page"{% endif %}>Terms</a>
      <a href="/nhrils/catalogue/privacy"{% if active_page == "privacy" %} aria-current="page"{% endif %}>Privacy</a>
    </nav>
  </div>
</header>
